name: Build and deploy Node.js app to Azure Web App - basically
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build application
        run: pnpm build
      
      - name: Verify build output
        run: |
          echo "Checking dist directory..."
          ls -la dist/
          echo "Checking for assets..."
          ls -la dist/assets/ || echo "No assets directory"
      
      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r dist/* deployment/
          cp package.json deployment/
          cp pnpm-lock.yaml deployment/ || true
          
          # Create a minimal package.json for serving
          cat > deployment/package.json << 'EOF'
          {
            "name": "basically",
            "version": "0.0.0",
            "scripts": {
              "start": "npx serve -s . -l 8080"
            }
          }
          EOF
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Verify deployment package
        run: |
          echo "Deployment package contents:"
          ls -la
          
      - name: Create .deployment file
        run: |
          echo '[config]' > .deployment
          echo 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' >> .deployment
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'basically'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6AFD6AFE243D44F0BF25036F5C0E5C21 }}
