name: Build and deploy Node.js app to Azure Web App - basically
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build application
        run: pnpm build
      
      - name: Create deployment package
        run: |
          # Create clean deployment directory
          mkdir -p deploy
          
          # Copy built files
          cp -r dist/* deploy/
          
          # Create package.json for runtime with npm (simpler for Azure)
          cat > deploy/package.json << 'EOF'
          {
            "name": "basically",
            "version": "1.0.0",
            "scripts": {
              "start": "npx serve -s . -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.1"
            }
          }
          EOF
          
          # Create .deployment file to disable Oryx build
          cat > deploy/.deployment << 'EOF'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT=false
          EOF
          
          # Create startup script
          cat > deploy/startup.sh << 'EOF'
          #!/bin/bash
          npm install --omit=dev
          npm start
          EOF
          chmod +x deploy/startup.sh
      
      - name: Verify deployment package
        run: |
          echo "Deployment package contents:"
          ls -la deploy/
          echo "---"
          cat deploy/package.json
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Verify downloaded package
        run: |
          echo "Downloaded package contents:"
          ls -la
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'basically'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6AFD6AFE243D44F0BF25036F5C0E5C21 }}
